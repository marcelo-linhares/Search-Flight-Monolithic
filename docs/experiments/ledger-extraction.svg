<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Inter,Arial,sans-serif" font-size="13" role="img" aria-label="Before and after extracting the Ledger: an in-process bus becomes events over HTTP through a bridge, and balance queries become HTTP reads" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="860" height="400" fill="#fff"/>
  <text x="20" y="24" font-weight="700" font-size="15" fill="#222">Before: one process, in-process bus</text>
  <rect x="20" y="36" width="820" height="110" rx="8" fill="#f6f7fb" stroke="#999"/>
  <rect x="40" y="62" width="110" height="52" rx="6" fill="#fde7f3" stroke="#EC4899"/><text x="95" y="93" text-anchor="middle" fill="#222">Billing</text>
  <rect x="190" y="62" width="110" height="52" rx="6" fill="#e0f7fb" stroke="#06B6D4"/><text x="245" y="93" text-anchor="middle" fill="#222">Ledger</text>
  <rect x="340" y="62" width="110" height="52" rx="6" fill="#f1e5fd" stroke="#A855F7"/><text x="395" y="93" text-anchor="middle" fill="#222">Watch</text>
  <rect x="490" y="62" width="110" height="52" rx="6" fill="#e3f9ec" stroke="#22C55E"/><text x="545" y="93" text-anchor="middle" fill="#222">Search</text>
  <rect x="640" y="62" width="180" height="52" rx="6" fill="#fff" stroke="#555" stroke-dasharray="4 3"/><text x="730" y="85" text-anchor="middle" fill="#222">publish() awaits handlers</text><text x="730" y="102" text-anchor="middle" fill="#555" font-size="11">function call, never fails alone</text>

  <text x="20" y="184" font-weight="700" font-size="15" fill="#222">After: two processes, the Ledger code is unchanged</text>
  <rect x="20" y="196" width="420" height="190" rx="8" fill="#f6f7fb" stroke="#999"/><text x="34" y="216" fill="#555" font-size="12">Monolith (src/server.js)</text>
  <rect x="40" y="230" width="110" height="40" rx="6" fill="#fde7f3" stroke="#EC4899"/><text x="95" y="255" text-anchor="middle" fill="#222">Billing</text>
  <rect x="40" y="280" width="110" height="40" rx="6" fill="#f1e5fd" stroke="#A855F7"/><text x="95" y="305" text-anchor="middle" fill="#222">Watch</text>
  <rect x="40" y="330" width="110" height="40" rx="6" fill="#e3f9ec" stroke="#22C55E"/><text x="95" y="355" text-anchor="middle" fill="#222">Search</text>
  <rect x="230" y="258" width="190" height="52" rx="6" fill="#fff" stroke="#555"/><text x="325" y="280" text-anchor="middle" fill="#222">RemoteEventBridge</text><text x="325" y="298" text-anchor="middle" fill="#555" font-size="11">outbox, retry, dead-letter</text>
  <rect x="230" y="326" width="190" height="52" rx="6" fill="#fff" stroke="#555"/><text x="325" y="348" text-anchor="middle" fill="#222">remote Ledger client</text><text x="325" y="366" text-anchor="middle" fill="#555" font-size="11">used by the HTTP read routes</text>
  <line x1="150" y1="250" x2="228" y2="274" stroke="#555" marker-end="url(#a)"/>
  <line x1="228" y1="288" x2="152" y2="298" stroke="#555" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <polyline points="150,350 190,350 190,300 228,300" fill="none" stroke="#555" marker-end="url(#a)"/>

  <rect x="650" y="230" width="190" height="140" rx="8" fill="#e0f7fb" stroke="#06B6D4"/><text x="745" y="256" text-anchor="middle" fill="#222" font-weight="700">Ledger service :5051</text><text x="745" y="280" text-anchor="middle" fill="#222" font-size="12">own bus, own repository</text><text x="745" y="298" text-anchor="middle" fill="#222" font-size="12">src/services/ledger-service.js</text><text x="745" y="326" text-anchor="middle" fill="#555" font-size="11">same Ledger context code</text>

  <line x1="420" y1="272" x2="648" y2="272" stroke="#555" marker-end="url(#a)"/><text x="534" y="266" text-anchor="middle" fill="#222" font-size="11">events to Ledger (POST)</text>
  <line x1="648" y1="298" x2="422" y2="298" stroke="#B0206F" stroke-dasharray="5 3" marker-end="url(#a)"/><text x="534" y="316" text-anchor="middle" fill="#B0206F" font-size="11">events back (POST)</text>
  <line x1="420" y1="352" x2="648" y2="352" stroke="#555" marker-end="url(#a)"/><text x="534" y="346" text-anchor="middle" fill="#222" font-size="11">balance, history (GET)</text>
</svg>
